[package]
name = "flowtrack"
version = "1.0.0"
description = "FlowTrack Desktop — Native application time tracker"
authors = ["FlowTrack Contributors"]
license = "MIT"
repository = "https://github.com/MTCodes01/flowtrack"
edition = "2021"

[lib]
name = "flowtrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "flowtrack"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell    = "2"
tauri-plugin-single-instance = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
opt-level = "s"   # Optimise for binary size
strip   = true
