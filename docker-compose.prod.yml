# FlowTrack — Production Compose override
# ─────────────────────────────────────────────────────────────────────────────
# Uses pre-built images from GHCR instead of building from source.
# Adds restart policies, resource limits, and production-safe defaults.
#
#   cp .env.example .env   # fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d
#
# ─────────────────────────────────────────────────────────────────────────────

name: flowtrack

services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?required}
      POSTGRES_USER:     ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - flowtrack_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M

  server:
    image: ghcr.io/flowtrack-app/flowtrack-server:${FLOWTRACK_VERSION:-latest}
    restart: always
    environment:
      DATABASE_URL:         postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SERVER_PORT:          ${SERVER_PORT:-8080}
      JWT_SECRET:           ${JWT_SECRET:?required}
      API_SECRET:           ${API_SECRET:?required}
      CORS_ORIGINS:         ${CORS_ORIGINS:-https://${DOMAIN:-localhost}}
      WEB_URL:              ${WEB_URL:-https://${DOMAIN:-localhost}}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      LEADERBOARD_ENABLED:  ${LEADERBOARD_ENABLED:-true}
      GIN_MODE:             release
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 256M
        reservations:
          memory: 64M

  web:
    image: ghcr.io/flowtrack-app/flowtrack-web:${FLOWTRACK_VERSION:-latest}
    restart: always
    depends_on:
      server:
        condition: service_healthy
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          memory: 32M

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount TLS certificates if managing them yourself:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - server
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  flowtrack_postgres:
    driver: local

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
